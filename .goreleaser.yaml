version: 2

project_name: wallapop

before:
  hooks:
    - go mod tidy

builds:
  - id: wallapop
    # cmd/wallapop rather than the module root so `go install .../cmd/wallapop`
    # names the binary wallapop, not wallapop-cli.
    main: ./cmd/wallapop
    binary: wallapop
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"

release:
  github:
    owner: Microck
    name: wallapop-cli
  draft: false
  prerelease: auto

homebrew_casks:
  - name: wallapop
    repository:
      owner: Microck
      name: homebrew-tap
      # The Actions GITHUB_TOKEN cannot write to another repo.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Microck/wallapop-cli
    description: Terminal CLI for Wallapop
    license: MIT
    # The binary is not notarized, so Gatekeeper would kill it on first run
    # unless the quarantine flag Homebrew sets on the download is removed.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wallapop"]
          end

scoops:
  - name: wallapop
    repository:
      owner: Microck
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/Microck/wallapop-cli
    description: Terminal CLI for Wallapop
    license: MIT

aurs:
  - name: wallapop-cli-bin
    homepage: https://github.com/Microck/wallapop-cli
    description: Terminal CLI for Wallapop
    license: MIT
    maintainers:
      - Microck <microck at users dot noreply dot github dot com>
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/wallapop-cli-bin.git
    skip_upload: auto
    provides:
      - wallapop-cli
    conflicts:
      - wallapop-cli
    depends:
      - ca-certificates
    package: |-
      install -Dm755 "./wallapop" "${pkgdir}/usr/bin/wallapop"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/wallapop-cli-bin/LICENSE"
    commit_author:
      name: Microck
      email: microck@users.noreply.github.com

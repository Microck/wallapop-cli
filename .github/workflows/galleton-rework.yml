name: galleton-rework

on:
  push:
    branches: [feat/galleton-managed-sessions]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare reproducible offline integration inputs
        run: |
          go mod download
          go mod download -json github.com/Microck/galleton@efe7b742536d6c118c37a269bf626c5927e2a1b9 > /tmp/galleton-module.json
          go mod download golang.org/toolchain@v0.0.1-go1.25.0.linux-amd64
          mkdir -p /tmp/rework-inputs
          git archive HEAD | gzip > /tmp/rework-inputs/source.tar.gz
          cp /tmp/galleton-module.json /tmp/rework-inputs/
          tar -czf /tmp/rework-inputs/modules.tar.gz -C "$(go env GOPATH)" pkg/mod
      - uses: actions/upload-artifact@v4
        with:
          name: galleton-rework-inputs
          path: /tmp/rework-inputs/
          retention-days: 1

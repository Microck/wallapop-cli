name: review-workspace

on:
  push:
    branches: [rework/galleton-cli-managed]
    paths: [.github/workflows/review-workspace.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact reviewed source
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
